name: snapshot

# Takes a snapshot of every dashboard every 15 minutes.
#
# GitHub's cron scheduler proved unreliable for this repo (no scheduled runs
# fired for hours), so each run is a loop: it takes a snapshot at every
# quarter hour for ~5h40m, then starts the next run itself via
# workflow_dispatch (allowed with GITHUB_TOKEN). The cron entry is kept only
# as a fallback to restart the chain if it ever breaks.
#
# Only one loop runs at a time: extra runs wait in the concurrency queue, and
# GitHub keeps at most one waiting run, replacing older ones.
#
# At hand-off the finishing run passes the quarter hour it last snapshotted
# ("after"), and the new run waits for the next quarter hour instead of
# snapshotting immediately, so no quarter hour is captured twice. A run
# started by hand or by the fallback cron has no "after"; it skips the current
# quarter hour only if the latest commit is already a snapshot from it.

on:
  schedule:
    - cron: "7 */3 * * *"   # fallback restarter only
  workflow_dispatch:
    inputs:
      after:
        description: "Unix time of the quarter hour the previous run already snapshotted (set by the hand-off)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: snapshot-loop
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      # Only check out the code, not the ever-growing snapshots/ folder.
      - uses: actions/checkout@v4
        with:
          # Latest main, not the commit the run was queued on: a queued cron run can
          # start hours later and must see the snapshot taken just before it.
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            logger
            .github
          sparse-checkout-cone-mode: true

      - name: Snapshot every 15 minutes
        env:
          AFTER: ${{ inputs.after }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 340*60 ))
          # Started by the backup cron or by hand: if the latest commit is a
          # snapshot from this quarter hour, treat that slot as done.
          if [ -z "$AFTER" ] && git log -1 --format=%s | grep -q '^snapshot '; then
            last=$(( $(git log -1 --format=%ct) / 900 * 900 ))
            [ "$last" -eq $(( $(date +%s) / 900 * 900 )) ] && AFTER=$last
          fi
          if [ -n "$AFTER" ]; then
            next=$(( AFTER + 900 ))
            now=$(date +%s)
            [ "$next" -gt "$now" ] && sleep $(( next - now ))
          fi
          while :; do
            echo $(( $(date +%s) / 900 * 900 )) > "$RUNNER_TEMP/last_slot"
            python3 logger/snapshot.py || echo "snapshot failed"
            # GitHub's weekly cron is unreliable, so start the weekly
            # re-pulls from here on Mondays at 09:15 UTC.
            if [ "$(date -u +%u%H%M)" = "10915" ]; then
              gh workflow run orange-county.yml --repo "$GITHUB_REPOSITORY" --ref main || true
              gh workflow run san-francisco.yml --repo "$GITHUB_REPOSITORY" --ref main || true
              gh workflow run california.yml --repo "$GITHUB_REPOSITORY" --ref main || true
            fi
            git add --sparse snapshots
            if ! git diff --cached --quiet; then
              git commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
              for i in 1 2 3 4 5; do
                git pull --rebase -q && git push -q && break
                sleep $((i * 5))
              done
            fi
            now=$(date +%s)
            next=$(( (now / 900 + 1) * 900 ))   # next quarter hour
            [ "$next" -ge "$end" ] && break
            sleep $(( next - now ))
          done

      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          after=$(cat "$RUNNER_TEMP/last_slot" 2>/dev/null || true)
          gh workflow run snapshot.yml --repo "$GITHUB_REPOSITORY" --ref main -f after="$after"
