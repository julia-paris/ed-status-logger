name: orange-county

# Weekly re-download of Orange County (CA) EMS's full diversion event table.
# The file is overwritten each time; git history keeps every earlier version,
# so later revisions or deletions by the county stay visible.

on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: snapshot   # shares the group with the 15-minute logger so pushes don't collide
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            history/orange_county
          sparse-checkout-cone-mode: true

      - name: Download diversion events
        run: python3 history/orange_county/scripts/oc_diversion_events.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/orange_county/oc_diversion_events.csv
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "orange county diversion events $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase -q && continue
            sleep $((i * 5))
          done
          exit 1
